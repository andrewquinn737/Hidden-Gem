<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hidden Gem — Scheduler</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b5651d" />
</head>
<body data-page="scheduler.html">
<div id="topnav"></div>
<main>
  <div class="row-between">
    <div class="cal-view-tabs">
      <button class="btn" data-view="day">Day</button>
      <button class="btn" data-view="week">Week</button>
      <button class="btn" data-view="month">Month</button>
    </div>
    <div class="row" style="gap:0.4rem;">
      <button id="upcomingBtn" class="btn">Upcoming events</button>
      <div style="position:relative;">
        <button id="schedMenuBtn" class="btn-link" style="font-size:1.5rem; padding:0.25rem 0.6rem;" aria-label="Scheduler menu">⋯</button>
        <div id="schedMenuDropdown" class="card stack" style="display:none; position:absolute; right:0; top:110%; z-index:20; min-width:200px; padding:0.4rem; gap:0.25rem;">
          <button id="connectGoogleBtn" class="btn" style="width:100%; text-align:left; border:none;">Connect Google Calendar</button>
          <button id="connectAppleBtn" class="btn" style="width:100%; text-align:left; border:none;">Connect Apple Calendar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dayNav" class="cal-nav">
    <button id="dayPrevBtn" class="btn">‹</button>
    <span id="dayNavLabel" class="cal-nav-label"></span>
    <button id="dayNextBtn" class="btn">›</button>
  </div>

  <div id="dayView" class="cal-day-grid"></div>
  <div id="weekView" class="cal-week-grid" style="display:none;"></div>
  <div id="monthView" style="display:none;">
    <div class="cal-nav">
      <button id="monthPrevBtn" class="btn">‹</button>
      <span id="monthNavLabel" class="cal-nav-label"></span>
      <button id="monthNextBtn" class="btn">›</button>
    </div>
    <div class="cal-month-grid" id="monthGrid"></div>
  </div>
  <div id="upcomingView" class="stack" style="display:none;"></div>
</main>

<script type="module" src="js/scheduler.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
