<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hidden Gem — Map</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b5651d" />
<style>
  /* The map page is a fixed fullscreen canvas, not a scrollable document —
     pinning body to the viewport (instead of letting it flow normally)
     stops iOS Safari's momentum-scroll/URL-bar rubber-banding from
     dragging the toolbar and tab bar out of place, which showed up as
     white gaps flashing in at the top/bottom while scrolling. */
  body[data-page="index.html"] { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; }
  main.map-main { max-width: none; padding: 0; position: relative; }
  .map-toolbar {
    position: absolute;
    top: max(0.75rem, env(safe-area-inset-top));
    left: 0.75rem; right: 0.75rem;
    z-index: 40;
    display: flex; gap: 0.5rem; flex-wrap: wrap;
  }
  .map-toolbar form { flex: 1; min-width: 160px; display: flex; }
  .map-toolbar input { border-radius: var(--radius) 0 0 var(--radius); }
  .map-toolbar button[type=submit] { border-radius: 0 var(--radius) var(--radius) 0; }
  /* Slightly transparent instead of solid — lighter touch than the bottom
     tab bar's translucency, just enough to hint at the map underneath. */
  .map-toolbar input,
  .map-toolbar button,
  .maplibregl-ctrl-group button {
    background: var(--map-toolbar-bg);
  }
  /* Match the zoom control to the toolbar buttons: same translucent white
     and border, no divider lines between the grouped +/−/compass buttons. */
  .maplibregl-ctrl-group {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: none !important;
  }
  .maplibregl-ctrl-group button + button { border-top: none !important; }
  /* MapLibre bakes the +/-/compass icons as dark-gray SVGs regardless of
     theme — against the dark translucent toolbar they're nearly invisible.
     Invert just the icon layer so they read as light against the dark bg. */
  @media (prefers-color-scheme: dark) {
    .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1); }
  }
  /* Align the zoom control with the floating mobile tab bar: same right
     inset, sitting just above its top edge instead of underneath/behind
     it. 4.25rem ≈ the tab bar's own height (~3.75rem) plus a small gap. */
  html.is-mobile-device .maplibregl-ctrl-bottom-right {
    right: 0;
    margin-right: 0.75rem;
    margin-bottom: calc(max(0.75rem, env(safe-area-inset-bottom)) + 4.25rem);
  }
  /* The GeolocateControl's own button is hidden — the toolbar's 📍 button
     triggers it programmatically instead, so there's one location button
     in the UI, not two. Its blue-dot marker (and the top-left corner it's
     otherwise anchored to) stays untouched. */
  .maplibregl-ctrl-top-left { display: none; }
</style>
</head>
<body data-page="index.html">
<div id="topnav"></div>
<main class="map-main">
  <div class="map-toolbar">
    <form id="searchForm">
      <input id="searchInput" placeholder="Search a place…" />
      <button type="submit" class="btn">Go</button>
    </form>
    <button id="geolocateBtn" class="btn">📍</button>
    <div style="position:relative;">
      <button id="mapMenuBtn" class="btn" aria-label="Map options">⋯</button>
      <div id="mapMenuDropdown" class="card dropdown-menu stack" style="display:none; position:absolute; right:0; top:110%; z-index:41; min-width:200px; padding:0.4rem; gap:0.15rem; max-height:70vh; overflow-y:auto;">
        <button class="btn dropdown-item map-filter-toggle" data-submenu="mapStyleSub" style="width:100%; text-align:left;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          <span>Map</span>
        </button>
        <div id="mapStyleSub" class="map-filter-submenu stack">
          <button class="btn dropdown-item map-filter-option" data-map-style="street" style="width:100%; text-align:left;">
            <span class="map-filter-check">✓</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h4l1-14h6l1 14h4"/><path d="M2 19h20"/></svg>
            <span>Street</span>
          </button>
          <button class="btn dropdown-item map-filter-option" data-map-style="satellite" style="width:100%; text-align:left;">
            <span class="map-filter-check">✓</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20"/></svg>
            <span>Satellite</span>
          </button>
          <button class="btn dropdown-item map-filter-option" data-map-style="parchment" style="width:100%; text-align:left;">
            <span class="map-filter-check">✓</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Parchment</span>
          </button>
        </div>
        <button class="btn dropdown-item map-filter-toggle" data-submenu="accountsSub" style="width:100%; text-align:left;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Accounts</span>
        </button>
        <div id="accountsSub" class="map-filter-submenu stack">
          <button class="btn dropdown-item map-filter-option selected" data-account-filter="mine" style="width:100%; text-align:left;">
            <span class="map-filter-check">✓</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#2f6fed"><path d="M12 2a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6z"/></svg>
            <span>Yours</span>
          </button>
          <button class="btn dropdown-item map-filter-option selected" data-account-filter="following" style="width:100%; text-align:left;">
            <span class="map-filter-check">✓</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#2e8b57"><path d="M12 2a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6z"/></svg>
            <span>Following</span>
          </button>
          <button class="btn dropdown-item map-filter-option selected" data-account-filter="public" style="width:100%; text-align:left;">
            <span class="map-filter-check">✓</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#b5651d"><path d="M12 2a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6z"/></svg>
            <span>Public</span>
          </button>
        </div>
        <button class="btn dropdown-item map-filter-toggle" data-submenu="tagSub" style="width:100%; text-align:left;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L2 12.01V2h10.01l8.58 8.58a2 2 0 0 1 0 2.83z"/><circle cx="7" cy="7" r="1.5"/></svg>
          <span>Tag</span>
        </button>
        <div id="tagSub" class="map-filter-submenu stack"></div>
      </div>
    </div>
  </div>
  <div id="repositionBanner" class="card row-between" style="display:none; position:absolute; top:max(0.75rem, env(safe-area-inset-top)); left:0.75rem; right:0.75rem; z-index:45;">
    <span id="repositionLabel" class="muted"></span>
    <div class="row" style="gap:0.4rem;">
      <button id="repositionCancelBtn" class="btn">Cancel</button>
      <button id="repositionConfirmBtn" class="btn btn-primary">Confirm</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="repositionMarker" class="pin-location-marker" style="display:none; position:absolute; top:50%; left:50%; z-index:41;">📍</div>
  <p id="holdHint" class="muted" style="position:absolute; bottom:0.5rem; left:0; right:0; text-align:center; z-index:40; font-size:0.75rem; pointer-events:none;">Hold anywhere on the map to add a pin</p>
</main>

<script src="https://unpkg.com/maplibre-gl@5.8.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/map.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
