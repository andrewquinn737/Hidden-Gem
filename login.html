<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hidden Gem — Sign in</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b5651d" />
</head>
<body data-page="login.html">
<main style="max-width:380px; margin-top: 3rem;">
  <div class="stack">
    <h1 style="text-align:center; margin-bottom:0;">🗺️ Hidden Gem</h1>
    <p class="muted" style="text-align:center; margin-top:0;">Find it. Mark it. Share it.</p>

    <div class="card stack">
      <div class="row" style="gap:0;">
        <button id="tabSignIn" class="btn" style="flex:1; border-radius: var(--radius) 0 0 var(--radius);">Sign in</button>
        <button id="tabSignUp" class="btn" style="flex:1; border-radius: 0 var(--radius) var(--radius) 0;">Sign up</button>
      </div>

      <form id="authForm" class="stack">
        <input id="email" type="email" placeholder="Email" required autocomplete="email" />
        <input id="password" type="password" placeholder="Password" required autocomplete="current-password" minlength="8" />
        <button type="submit" id="submitBtn" class="btn btn-primary">Sign in</button>
      </form>

      <div class="row" style="align-items:center; gap:0.5rem; margin: 0.25rem 0;">
        <hr style="flex:1; border:none; border-top:1px solid var(--border);" />
        <span class="muted" style="font-size:0.8rem;">or</span>
        <hr style="flex:1; border:none; border-top:1px solid var(--border);" />
      </div>
      <button id="googleBtn" class="btn" style="background:#fff; border-color:var(--border); color:#3c4043; display:flex; align-items:center; justify-content:center; gap:0.5rem;">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.63h6.47c-.28 1.48-1.13 2.74-2.4 3.58v2.98h3.88c2.27-2.09 3.57-5.17 3.57-8.74z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-2.98c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.07C3.25 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.31A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.58.37-2.31V6.62H1.27A11.97 11.97 0 0 0 0 12c0 1.93.46 3.76 1.27 5.38l4-3.07z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.62l4 3.07C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        Continue with Google
      </button>
      <button id="appleBtn" class="btn" style="background:#000; border-color:#000; color:#fff; display:flex; align-items:center; justify-content:center; gap:0.5rem;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M16.365 1.43c0 1.14-.493 2.27-1.177 3.08-.744.9-1.99 1.57-2.987 1.57-.12 0-.23-.02-.3-.03-.01-.06-.04-.22-.04-.39 0-1.15.572-2.27 1.206-2.98.804-.94 2.142-1.64 3.248-1.68.03.13.05.28.05.43zm4.565 15.71c-.03.07-.463 1.58-1.518 3.12-.945 1.34-1.94 2.71-3.43 2.71-1.517 0-1.9-.88-3.63-.88-1.698 0-2.302.91-3.63.91-1.372 0-2.427-1.436-3.428-2.79-1.766-2.43-3.123-6.865-1.32-9.865.9-1.49 2.507-2.43 4.26-2.46 1.35-.02 2.62.9 3.42.9.79 0 2.36-1.13 3.98-.96.678.03 2.58.27 3.803 2.05-.098.06-2.27 1.32-2.245 3.98.03 3.18 2.79 4.24 2.82 4.25z"/></svg>
        Continue with Apple
      </button>
      <p id="formError" class="error-text" style="display:none;"></p>
      <p id="formSuccess" class="muted" style="display:none;"></p>
    </div>
  </div>
</main>

<script type="module">
  import { supabase } from "./js/supabaseClient.js";

  const redirectTarget = new URLSearchParams(window.location.search).get("redirect") || "profile.html";

  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.href = redirectTarget;

  let mode = "signin"; // "signin" | "signup"
  const tabSignIn = document.getElementById("tabSignIn");
  const tabSignUp = document.getElementById("tabSignUp");
  const submitBtn = document.getElementById("submitBtn");
  const form = document.getElementById("authForm");
  const errorEl = document.getElementById("formError");
  const successEl = document.getElementById("formSuccess");

  function setMode(next) {
    mode = next;
    tabSignIn.classList.toggle("btn-primary", mode === "signin");
    tabSignUp.classList.toggle("btn-primary", mode === "signup");
    submitBtn.textContent = mode === "signin" ? "Sign in" : "Create account";
    document.getElementById("password").autocomplete = mode === "signin" ? "current-password" : "new-password";
  }
  tabSignIn.addEventListener("click", () => setMode("signin"));
  tabSignUp.addEventListener("click", () => setMode("signup"));
  setMode("signin");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
    successEl.style.display = "none";
  }
  function showSuccess(msg) {
    successEl.textContent = msg;
    successEl.style.display = "block";
    errorEl.style.display = "none";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    submitBtn.disabled = true;
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = redirectTarget;
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        window.location.href = redirectTarget;
      }
    } catch (err) {
      showError(err.message || "Something went wrong.");
    } finally {
      submitBtn.disabled = false;
    }
  });

  document.getElementById("googleBtn").addEventListener("click", async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: `${window.location.origin}/${redirectTarget}` },
    });
    if (error) showError(error.message);
  });
  document.getElementById("appleBtn").addEventListener("click", async () => {
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "apple",
      options: { redirectTo: `${window.location.origin}/${redirectTarget}` },
    });
    if (error) showError(error.message);
  });
</script>
</body>
</html>
