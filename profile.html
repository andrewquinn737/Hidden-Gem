<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hidden Gem — Profile</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b5651d" />
</head>
<body data-page="profile.html">
<div id="topnav"></div>
<main class="stack">
  <div class="row-between">
    <div class="row">
      <img id="avatarImg" class="avatar" style="width:64px; height:64px;" src="icons/icon-192.png" />
      <div>
        <strong id="profileUsername" style="font-size:1.15rem;">—</strong>
        <div class="muted" id="profileFullName"></div>
      </div>
    </div>
    <div style="position:relative;">
      <button id="menuBtn" class="btn-link" style="font-size:1.5rem; padding:0.25rem 0.6rem;" aria-label="Profile menu">⋯</button>
      <div id="menuDropdown" class="card" style="display:none; position:absolute; right:0; top:110%; z-index:20; min-width:160px; padding:0.4rem;">
        <button id="editProfileBtn" class="btn" style="width:100%; text-align:left; border:none;">Edit profile</button>
      </div>
    </div>
  </div>

  <div class="row card">
    <div><strong id="statPins">0</strong><div class="muted">pins</div></div>
    <div><strong id="statFollowers">0</strong><div class="muted">followers</div></div>
    <div><strong id="statFollowing">0</strong><div class="muted">following</div></div>
  </div>

  <div id="pinsGrid" class="pins-grid"></div>

  <div class="card stack">
    <h2 style="margin:0;">Calendars</h2>
    <div class="row-between"><span>Google Calendar</span><span id="googleStatus" class="pill">—</span></div>
    <div class="row-between"><span>Apple Calendar</span><span id="appleStatus" class="pill">—</span></div>
    <p class="muted">Manage connections from the Scheduler tab.</p>
  </div>

  <div class="card stack">
    <h2 style="margin:0;">Share Hidden Gem</h2>
    <p class="muted" style="margin:0;">Invite someone else to start marking their own spots.</p>
    <div class="row">
      <button id="shareAppBtn" class="btn btn-primary" style="flex:1;">Share app</button>
      <button id="installAppBtn" class="btn" style="flex:1;">Install app</button>
    </div>
    <p id="shareStatus" class="muted" style="display:none;"></p>
  </div>
</main>

<script type="module" src="js/profile.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
