<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hidden Gem — Profile</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b5651d" />
</head>
<body data-page="profile.html">
<div id="topnav"></div>
<main class="stack">
  <button id="backBtn" class="btn-link" style="display:none; padding:0; align-self:flex-start;" aria-label="Back">← Back</button>
  <div class="row-between profile-header-row">
    <div class="row" style="align-items:center; gap:0.85rem;">
      <span id="avatarPlaceholder" class="avatar avatar-placeholder" style="width:64px; height:64px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
      <img id="avatarImg" class="avatar" style="width:64px; height:64px; display:none;" />
      <div>
        <strong id="profileUsername" style="font-size:1.1rem; display:block;">—</strong>
        <span class="muted" style="font-size:0.85rem;">
          <button id="followersCountBtn" class="btn-link" style="padding:0; font-size:inherit; color:inherit;"><span id="statFollowers">0</span> <span id="statFollowersLabel">followers</span></button> ·
          <button id="followingCountBtn" class="btn-link" style="padding:0; font-size:inherit; color:inherit;"><span id="statFollowing">0</span> <span id="statFollowingLabel">following</span></button>
        </span>
      </div>
    </div>
    <div id="ownMenuArea" class="row" style="gap:0.3rem; display:none;">
      <button id="notifBtn" class="btn-link icon-btn" style="position:relative; padding:0.25rem 0.4rem;" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px; height:24px;"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="notifDot" style="display:none; position:absolute; top:2px; right:2px; width:9px; height:9px; border-radius:50%; background:var(--danger); border:1.5px solid var(--surface);"></span>
      </button>
      <div style="position:relative;">
        <button id="menuBtn" class="btn-link" style="font-size:1.5rem; padding:0.25rem 0.6rem;" aria-label="Profile menu">⋯</button>
        <div id="menuDropdown" class="card dropdown-menu stack" style="display:none; position:absolute; right:0; top:110%; z-index:20; min-width:170px; padding:0.4rem; gap:0.25rem;">
          <button id="editProfileBtn" class="btn dropdown-item" style="width:100%; text-align:left;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
            <span>Edit profile</span>
          </button>
          <button id="shareAppBtn" class="btn dropdown-item" style="width:100%; text-align:left;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
            <span>Share app</span>
          </button>
          <button id="signOutMenuBtn" class="btn dropdown-item" style="width:100%; text-align:left;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Sign out</span>
          </button>
        </div>
      </div>
    </div>
    <div id="friendActionArea"></div>
  </div>

  <div id="profileToggle" class="profile-toggle" style="display:none;">
    <button class="profile-toggle-btn active" data-view="posts">Your posts</button>
    <button class="profile-toggle-btn" data-view="saved">Saved</button>
  </div>

  <div id="friendRequests"></div>

  <div id="pinsGrid" class="pins-grid"></div>
  <p id="shareStatus" class="muted" style="display:none;"></p>
</main>
<button id="addPinFab" class="fab-add-pin" style="display:none;" aria-label="Add pin">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<script type="module" src="js/profile.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
