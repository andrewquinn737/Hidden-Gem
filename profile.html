<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hidden Gem — Profile</title>
<script>
  (function () {
    var ua = navigator.userAgent || navigator.vendor || "";
    var isMobileUA = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Windows Phone|Mobile/i.test(ua);
    var isIpadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    document.documentElement.classList.add(isMobileUA || isIpadOS ? "is-mobile-device" : "is-desktop-device");
  })();
</script>
<link rel="stylesheet" href="css/style.css" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#b5651d" />
</head>
<body data-page="profile.html">
<div id="topnav"></div>
<main class="stack">
  <div class="row" style="align-items:flex-start;">
    <img id="avatarImg" class="avatar" style="width:64px; height:64px;" src="icons/icon-192.png" />
    <div style="flex:1;">
      <!-- Row 1: name + (own) 3-dot menu -->
      <div class="row-between">
        <div>
          <strong id="profileUsername" style="font-size:1.1rem;">—</strong>
          <div class="muted" id="profileFullName" style="font-size:0.85rem;"></div>
        </div>
        <div id="ownMenuArea" style="position:relative; display:none;">
          <button id="menuBtn" class="btn-link" style="font-size:1.5rem; padding:0.25rem 0.6rem;" aria-label="Profile menu">⋯</button>
          <div id="menuDropdown" class="card stack" style="display:none; position:absolute; right:0; top:110%; z-index:20; min-width:160px; padding:0.4rem; gap:0.25rem;">
            <button id="editProfileBtn" class="btn" style="width:100%; text-align:left; border:none;">Edit profile</button>
            <button id="shareAppBtn" class="btn" style="width:100%; text-align:left; border:none;">Share app</button>
            <button id="signOutMenuBtn" class="btn" style="width:100%; text-align:left; border:none;">Sign out</button>
          </div>
        </div>
      </div>
      <!-- Row 2: pin/friend counts + (own) Add pin, or (others) friend action -->
      <div class="row-between" style="margin-top:0.4rem;">
        <div class="row" style="gap:1.1rem;">
          <span><strong id="statPins">0</strong> <span class="muted" id="statPinsLabel">pins</span></span>
          <button id="friendsCountBtn" class="btn-link" style="padding:0;"><strong id="statFriends">0</strong> <span class="muted" id="statFriendsLabel">friends</span></button>
        </div>
        <button id="addPinBtn" class="btn" style="display:none; font-size:0.8rem; padding:0.35rem 0.6rem;" aria-label="Add new pin">+ Add pin</button>
        <div id="friendActionArea"></div>
      </div>
    </div>
  </div>

  <div id="friendRequests"></div>

  <div id="pinsGrid" class="pins-grid"></div>
  <p id="shareStatus" class="muted" style="display:none;"></p>
</main>

<script type="module" src="js/profile.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
